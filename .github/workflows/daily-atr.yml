name: Smart Daily ATR - Enhanced with Levels Integration

# Market-aware multi-time execution strategy with levels support
on:
  schedule:
    # 5:30 PM EST/EDT - Primary run (WEEKDAYS ONLY - stocks/ETFs/futures, NO crypto)
    - cron: '30 22 * * 1-5'  # Mon-Fri 5:30 PM EST (22:30 UTC)
    - cron: '30 21 * * 1-5'  # Mon-Fri 5:30 PM EDT (21:30 UTC)
    
    # 8:00 PM EST/EDT - Crypto + retry run (DAILY - crypto always, retry stocks if weekday)
    - cron: '0 1 * * *'      # Daily 8:00 PM EST (01:00 UTC next day)
    - cron: '0 0 * * *'      # Daily 8:00 PM EDT (00:00 UTC next day)
    
    # 12:30 AM EST/EDT - Final retry (WEEKDAYS ONLY - final attempt for all failures)
    - cron: '30 5 * * 2-6'  # Tue-Sat 12:30 AM EST (05:30 UTC) - covers Mon-Fri trading
    - cron: '30 4 * * 2-6'  # Tue-Sat 12:30 AM EDT (04:30 UTC)
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      execution_phase:
        description: 'Execution Phase'
        required: false
        default: 'primary'
        type: choice
        options:
          - 'primary'
          - 'retry_stocks'
          - 'retry_final'
          - 'gap_detection'
      polygon_api_key:
        description: 'Polygon API Key (optional - will use Yahoo Finance if not provided)'
        required: false
        type: string

jobs:
  smart-atr-with-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Increased for intraday processing
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz requests numpy
    
    - name: Determine Execution Phase
      timeout-minutes: 2
      run: |
        echo "🕐 Determining execution phase..."
        
        cat > determine_phase.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import os
        from datetime import datetime, timedelta
        import pytz
        
        def determine_execution_phase():
            """Determine execution phase with market-aware scheduling"""
            
            # Check for manual override
            manual_phase = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
            if manual_phase:
                phase = os.getenv('INPUT_EXECUTION_PHASE', 'primary')
                print(f"🔧 Manual execution: {phase}")
                return phase
            
            # Determine phase based on current time and day
            eastern = pytz.timezone('US/Eastern')
            now = datetime.now(eastern)
            hour = now.hour
            weekday = now.weekday()  # 0=Monday, 6=Sunday
            is_weekend = weekday >= 5  # Saturday=5, Sunday=6
            
            if 17 <= hour < 20:  # 5:30 PM - 8:00 PM
                if is_weekend:
                    phase = 'weekend_skip'  # No primary run on weekends
                else:
                    phase = 'primary'  # Weekday primary (no crypto)
                    
            elif 20 <= hour < 24:  # 8:00 PM - 12:00 AM
                phase = 'crypto_retry'  # Daily crypto + weekday retries
                
            elif 0 <= hour < 6:   # 12:30 AM - 6:00 AM
                if is_weekend:
                    phase = 'weekend_skip'  # No final retry on weekends
                else:
                    phase = 'retry_final'  # Weekday final retry
            else:
                phase = 'gap_detection'  # Fallback/maintenance
            
            print(f"🕐 Time-based execution: {phase} (hour: {hour}, weekend: {is_weekend})")
            return phase
        
        def main():
            phase = determine_execution_phase()
            
            # Save phase for subsequent steps
            with open('execution_phase.txt', 'w') as f:
                f.write(phase)
                
            print(f"📋 Execution phase: {phase}")
            return 0
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python determine_phase.py
        
        # Set environment variable for subsequent steps
        PHASE=$(cat execution_phase.txt)
        echo "EXECUTION_PHASE=$PHASE" >> $GITHUB_ENV
        echo "✅ Phase determination completed: $PHASE"

    - name: Analyze Previous Execution Results
      timeout-minutes: 3
      run: |
        echo "🔍 Analyzing previous execution results..."
        echo "📊 Phase: $EXECUTION_PHASE"
        
        cat > analyze_previous_results.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import os
        from datetime import datetime, timedelta
        import pytz
        
        def load_current_atr_status():
            """Load ATR status with weekend/crypto awareness"""
            
            try:
                with open('atr_levels.json', 'r') as f:
                    atr_data = json.load(f)
                    
                # Check if data is from today (with weekend considerations)
                eastern = pytz.timezone('US/Eastern')
                now = datetime.now(eastern)
                today = now.date()
                is_weekend = now.weekday() >= 5
                
                last_updated = atr_data.get('last_updated', '')
                if last_updated:
                    try:
                        last_date = datetime.fromisoformat(last_updated.replace(' UTC', '+00:00')).date()
                        is_today = last_date == today
                        
                        # Weekend logic: if it's weekend and last update was Friday, that's OK
                        if is_weekend and not is_today:
                            days_ago = (today - last_date).days
                            is_recent_enough = days_ago <= 2  # Friday to Sunday = 2 days
                        else:
                            is_recent_enough = is_today
                    except:
                        is_today = False
                        is_recent_enough = False
                else:
                    is_today = False
                    is_recent_enough = False
                
                tickers = atr_data.get('tickers', {})
                
                print(f"📊 Current ATR JSON status:")
                print(f"   📅 Last updated: {last_updated}")
                print(f"   🗓️ Is from today: {is_today}")
                print(f"   🗓️ Recent enough: {is_recent_enough}")
                print(f"   🔄 Weekend mode: {is_weekend}")
                print(f"   📈 Total tickers: {len(tickers)}")
                
                # Categorize tickers by success/failure status
                successful = {}
                failed = {}
                
                for ticker, data in tickers.items():
                    if data.get('status') == 'success':
                        successful[ticker] = data
                    else:
                        failed[ticker] = data
                
                # Weekend failure analysis
                if is_weekend:
                    print(f"   🔄 Weekend analysis: Traditional market 'failures' may be expected")
                
                print(f"   ✅ Successful: {len(successful)}")
                print(f"   ❌ Failed: {len(failed)}")
                
                if failed:
                    print(f"   🔄 Failed tickers: {list(failed.keys())}")
                
                return {
                    'is_current': is_recent_enough,
                    'is_weekend': is_weekend,
                    'successful': successful,
                    'failed': failed,
                    'all_tickers': tickers
                }
                
            except FileNotFoundError:
                print("⚠️ No existing ATR JSON found")
                return {
                    'is_current': False,
                    'is_weekend': datetime.now(pytz.timezone('US/Eastern')).weekday() >= 5,
                    'successful': {},
                    'failed': {},
                    'all_tickers': {}
                }
            except Exception as e:
                print(f"❌ Error reading ATR JSON: {str(e)}")
                return {
                    'is_current': False,
                    'is_weekend': datetime.now(pytz.timezone('US/Eastern')).weekday() >= 5,
                    'successful': {},
                    'failed': {},
                    'all_tickers': {}
                }
        
        def load_discovered_tickers():
            """Load discovered tickers configuration"""
            try:
                with open('discovered_tickers.json', 'r') as f:
                    config = json.load(f)
                return config.get('tickers', {})
            except:
                return {}
        
        def is_crypto_ticker(ticker):
            """Identify crypto tickers"""
            crypto_patterns = [
                ticker.endswith('-USD'),
                ticker.endswith('USD'),
                ticker.endswith('-BTC'),
                ticker.endswith('-ETH'),
                ticker in ['BTC', 'ETH', 'ADA', 'SOL', 'DOGE', 'XRP', 'DOT', 'AVAX']
            ]
            return any(crypto_patterns)
        
        def is_futures_ticker(ticker):
            """Identify futures tickers"""
            futures_patterns = [
                ticker in ['ES', 'NQ', 'YM', 'RTY', 'GC', 'SI', 'CL', 'NG'],
                ticker.endswith('=F'),
                len(ticker) <= 2 and ticker.isalpha()  # Simple heuristic
            ]
            return any(futures_patterns)
        
        def should_run_today(phase):
            """Determine if this phase should run today based on market schedule"""
            eastern = pytz.timezone('US/Eastern')
            now = datetime.now(eastern)
            weekday = now.weekday()  # 0=Monday, 6=Sunday
            is_weekend = weekday >= 5
            
            if phase == 'primary':
                return not is_weekend
            elif phase == 'crypto_retry':
                return True
            elif phase == 'retry_final':
                return not is_weekend
            elif phase == 'weekend_skip':
                return False
            else:  # gap_detection, etc.
                return True
        
        def determine_retry_targets(phase, atr_status, discovered_tickers):
            """Determine targets with market-aware crypto/futures handling"""
            
            eastern = pytz.timezone('US/Eastern')
            now = datetime.now(eastern)
            is_weekend = now.weekday() >= 5
            
            if phase == 'weekend_skip':
                print("🛑 WEEKEND_SKIP: Not a trading day for traditional markets")
                return {}
            
            elif phase == 'primary':
                # Primary: All non-crypto tickers
                targets = {}
                for ticker, config in discovered_tickers.items():
                    if not is_crypto_ticker(ticker):
                        targets[ticker] = config
                
                print(f"🎯 PRIMARY: Targeting {len(targets)} traditional market tickers (NO crypto)")
                if len(targets) != len(discovered_tickers):
                    crypto_count = len(discovered_tickers) - len(targets)
                    print(f"   ⏰ Skipping {crypto_count} crypto tickers (waiting for 8PM run)")
                
            elif phase == 'crypto_retry':
                targets = {}
                
                # Always include ALL crypto tickers (daily)
                crypto_tickers = {k: v for k, v in discovered_tickers.items() 
                                if is_crypto_ticker(k)}
                targets.update(crypto_tickers)
                
                # On weekdays, also retry failed traditional markets
                if not is_weekend:
                    failed_tickers = atr_status['failed']
                    for ticker in failed_tickers.keys():
                        if ticker in discovered_tickers and not is_crypto_ticker(ticker):
                            if not is_futures_ticker(ticker):
                                targets[ticker] = discovered_tickers[ticker]
                
                if is_weekend:
                    print(f"🎯 CRYPTO_RETRY (Weekend): {len(targets)} crypto tickers only")
                else:
                    crypto_count = len(crypto_tickers)
                    retry_count = len(targets) - crypto_count
                    print(f"🎯 CRYPTO_RETRY (Weekday): {crypto_count} crypto + {retry_count} failed traditional")
                
            elif phase == 'retry_final':
                # Final retry: ALL remaining failures
                failed_tickers = atr_status['failed']
                targets = {k: discovered_tickers[k] for k in failed_tickers.keys() 
                          if k in discovered_tickers}
                
                print(f"🎯 RETRY_FINAL: {len(targets)} remaining failures (all asset classes)")
                
            elif phase == 'gap_detection':
                # Gap detection: all tickers
                targets = discovered_tickers.copy()
                print(f"🎯 GAP_DETECTION: Analyzing all {len(targets)} tickers")
                
            else:
                targets = {}
                print(f"⚠️ Unknown phase: {phase}")
            
            return targets
        
        def main():
            # Load phase from previous step
            try:
                with open('execution_phase.txt', 'r') as f:
                    phase = f.read().strip()
            except:
                phase = 'primary'  # Fallback
                
            print(f"📋 Loaded execution phase: {phase}")
            
            # Early exit for weekend skips
            if not should_run_today(phase):
                print(f"⏭️ Phase {phase} should not run today - exiting gracefully")
                
                with open('retry_targets.json', 'w') as f:
                    json.dump({}, f)
                with open('should_process.txt', 'w') as f:
                    f.write('false')
                return 0
            
            # Analyze current status
            atr_status = load_current_atr_status()
            discovered_tickers = load_discovered_tickers()
            
            # Determine what to target this run
            retry_targets = determine_retry_targets(phase, atr_status, discovered_tickers)
            
            # Save targets for data processing step
            with open('retry_targets.json', 'w') as f:
                json.dump(retry_targets, f, indent=2)
            
            # Summary
            print(f"\n📋 Execution Summary:")
            print(f"   🕐 Phase: {phase}")
            print(f"   🗓️ Weekend mode: {atr_status.get('is_weekend', False)}")
            print(f"   🎯 Targets: {len(retry_targets)} tickers")
            print(f"   📊 Previous success: {len(atr_status['successful'])}")
            print(f"   📊 Previous failures: {len(atr_status['failed'])}")
            
            if retry_targets:
                print(f"   📋 Target list: {list(retry_targets.keys())}")
            
            # Set flag for whether we should skip processing
            should_process = len(retry_targets) > 0
            with open('should_process.txt', 'w') as f:
                f.write('true' if should_process else 'false')
            
            if not should_process:
                print("✅ No targets identified - will skip data processing")
            
            return 0
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python analyze_previous_results.py
        
        echo "✅ Previous results analysis completed"

    - name: Create Enhanced Levels Processor
      timeout-minutes: 3
      run: |
        echo "🔧 Creating enhanced levels processor with smart retry support..."
        
        cat > enhanced_levels_processor.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import yfinance as yf
        import pandas as pd
        import numpy as np
        import gzip
        import os
        from datetime import datetime, timedelta, date
        import pytz
        
        def calculate_atr(df, period=14):
            """Calculate Average True Range with proper handling"""
            if len(df) < period:
                return pd.Series([np.nan] * len(df), index=df.index)
            
            # Calculate True Range components
            high_low = df['High'] - df['Low']
            high_close_prev = abs(df['High'] - df['Close'].shift(1))
            low_close_prev = abs(df['Low'] - df['Close'].shift(1))
            
            # True Range is the maximum of the three
            true_range = pd.concat([high_low, high_close_prev, low_close_prev], axis=1).max(axis=1)
            
            # ATR is the rolling mean of True Range
            atr = true_range.rolling(window=period, min_periods=period).mean()
            
            return atr
        
        def load_historical_data(ticker_key):
            """Load existing compressed historical data with robust date handling"""
            historical_dir = "historical_data"
            os.makedirs(historical_dir, exist_ok=True)
            
            compressed_file = f"{historical_dir}/{ticker_key}_daily.csv.gz"
            
            if os.path.exists(compressed_file):
                try:
                    with gzip.open(compressed_file, 'rt') as f:
                        df = pd.read_csv(f)
                    
                    # Robust date parsing with multiple fallback strategies
                    try:
                        df['Date'] = pd.to_datetime(df['Date']).dt.date
                    except (ValueError, AttributeError, TypeError):
                        try:
                            # Fallback 1: Force string conversion first
                            df['Date'] = pd.to_datetime(df['Date'].astype(str), errors='coerce').dt.date
                        except:
                            try:
                                # Fallback 2: Handle mixed date formats
                                df['Date'] = pd.to_datetime(df['Date'], infer_datetime_format=True, errors='coerce').dt.date
                            except:
                                # Fallback 3: Manual parsing
                                print(f"        🔧 Using manual date parsing for {ticker_key}")
                                df['Date'] = df['Date'].apply(lambda x: pd.to_datetime(str(x), errors='coerce').date() if pd.notna(x) else None)
                    
                    # Remove any rows with failed date parsing
                    df = df.dropna(subset=['Date'])
                    
                    print(f"        📊 Loaded {len(df)} historical records")
                    return df, compressed_file
                except Exception as e:
                    print(f"        ❌ Error loading {compressed_file}: {e}")
            
            return None, compressed_file
        
        def create_ticker_mapping(ticker):
            """Create Yahoo Finance symbol mapping"""
            mapping = {
                'SPX': '^SPX',     # S&P 500 Index
                'ES': 'ES=F',      # E-mini S&P 500 Futures
                'NQ': 'NQ=F',      # E-mini NASDAQ Futures  
                'YM': 'YM=F',      # E-mini Dow Futures
                'RTY': 'RTY=F',    # E-mini Russell 2000 Futures
                'GC': 'GC=F',      # Gold Futures
                'CL': 'CL=F',      # Crude Oil Futures
                'ZN': 'ZN=F',      # 10-Year Treasury Note Futures
                'VIX': '^VIX',     # CBOE Volatility Index
                'DXY': 'DX=F'      # US Dollar Index Futures
            }
            return mapping.get(ticker, ticker)
        
        def should_use_polygon(ticker_key):
            """Determine if ticker should use Polygon as primary source"""
            if ticker_key.startswith('^'):
                return False  # Indices - use Yahoo Finance
            
            if ticker_key in ['SPX', 'DJI', 'NDX', 'RUT']:
                return False  # Index symbols - use Yahoo Finance
                
            if ticker_key.endswith('=F'):
                return False  # Futures - Yahoo Finance may be better
            
            if ticker_key in ['ES', 'NQ', 'YM', 'RTY', 'GC', 'SI', 'CL', 'NG']:
                return False  # Major futures - stick with Yahoo Finance
            
            return True  # Default: try Polygon first for stocks/ETFs
        
        def convert_to_polygon_symbol(ticker_key, yf_symbol):
            """Convert ticker to Polygon format if needed"""
            if ticker_key == yf_symbol and not ticker_key.startswith('^'):
                return ticker_key
            
            # Handle special mappings
            polygon_mappings = {
                'SPX': None,  # SPX index - not available on Polygon
                'ES': None,   # Futures - complex on Polygon
                'NQ': None,
                'YM': None,
                'RTY': None
            }
            
            return polygon_mappings.get(ticker_key, ticker_key)
        
        def fetch_from_polygon(symbol, start_date, end_date):
            """Fetch data from Polygon.io API with consistent date handling"""
            try:
                import requests
                
                api_key = os.getenv('POLYGON_API_KEY')
                if not api_key:
                    return None
                
                url = f"https://api.polygon.io/v2/aggs/ticker/{symbol}/range/1/day/{start_date}/{end_date}"
                params = {
                    'apikey': api_key,
                    'adjusted': 'true',
                    'sort': 'asc'
                }
                
                response = requests.get(url, params=params, timeout=30)
                
                if response.status_code != 200:
                    return None
                
                data = response.json()
                
                if data.get('status') != 'OK' or not data.get('results'):
                    return None
                
                # Convert Polygon format to standard format with consistent date handling
                records = []
                for bar in data['results']:
                    # Polygon timestamps are in milliseconds, convert to naive datetime
                    dt = datetime.fromtimestamp(bar['t'] / 1000)
                    # Ensure we store as naive datetime (no timezone)
                    date = dt.replace(tzinfo=None)
                    
                    records.append({
                        'Date': date,
                        'Open': bar['o'],
                        'High': bar['h'],
                        'Low': bar['l'],
                        'Close': bar['c'],
                        'Volume': bar['v']
                    })
                
                if not records:
                    return None
                
                df = pd.DataFrame(records)
                df['Date'] = pd.to_datetime(df['Date'])
                
                return df
                
            except Exception as e:
                print(f"        ❌ Polygon fetch error: {str(e)}")
                return None
        
        def fetch_from_yahoo(yf_symbol, start_date, end_date):
            """Fetch data from Yahoo Finance with consistent date handling"""
            try:
                yf_ticker = yf.Ticker(yf_symbol)
                data = yf_ticker.history(start=start_date, end=end_date + timedelta(days=1))
                
                if data.empty:
                    return None
                
                # Process data with consistent date handling
                data = data.reset_index()
                if isinstance(data.columns, pd.MultiIndex):
                    data.columns = data.columns.get_level_values(0)
                
                standard_columns = ['Date', 'Open', 'High', 'Low', 'Close', 'Volume']
                available_columns = [col for col in standard_columns if col in data.columns]
                data = data[available_columns]
                
                # Normalize datetime handling - remove timezone info for consistency
                data['Date'] = pd.to_datetime(data['Date'])
                if hasattr(data['Date'].iloc[0], 'tz') and data['Date'].iloc[0].tz is not None:
                    data['Date'] = data['Date'].dt.tz_localize(None)
                
                return data
                
            except Exception as e:
                print(f"        ❌ Yahoo Finance error: {str(e)}")
                return None
        
        def fetch_new_daily_data(ticker_key, yf_symbol, target_date, last_date_in_data=None):
            """Fetch new daily data with Polygon primary, Yahoo Finance backup"""
            try:
                if last_date_in_data:
                    start_date = last_date_in_data + timedelta(days=1)
                    if start_date > target_date:
                        print(f"        ✅ Data is current")
                        return None
                    print(f"        📅 Fetching from {start_date} to {target_date}")
                else:
                    start_date = target_date - timedelta(days=180)  # 6 months
                    print(f"        📅 Initial fetch: {start_date} to {target_date}")
                
                # Determine data source preference
                polygon_symbol = convert_to_polygon_symbol(ticker_key, yf_symbol)
                use_polygon = should_use_polygon(ticker_key)
                
                new_data = None
                
                if use_polygon and polygon_symbol:
                    print(f"        🔵 Trying Polygon first: {polygon_symbol}")
                    new_data = fetch_from_polygon(polygon_symbol, start_date, target_date)
                    
                    if new_data is not None and len(new_data) > 0:
                        print(f"        ✅ Polygon success: {len(new_data)} records")
                    else:
                        print(f"        ⚠️ Polygon failed, falling back to Yahoo Finance")
                        new_data = None
                
                # Yahoo Finance primary or backup
                if new_data is None:
                    print(f"        🟡 Using Yahoo Finance: {yf_symbol}")
                    new_data = fetch_from_yahoo(yf_symbol, start_date, target_date)
                    
                    if new_data is not None and len(new_data) > 0:
                        print(f"        ✅ Yahoo Finance success: {len(new_data)} records")
                    else:
                        print(f"        ❌ Yahoo Finance also failed")
                        return None
                
                # Add metadata to processed data
                if new_data is not None:
                    new_data['Ticker'] = ticker_key
                    new_data['YF_Symbol'] = yf_symbol
                    new_data['Downloaded_At'] = datetime.now().isoformat()
                    
                    # Add data source info
                    if polygon_symbol and use_polygon:
                        new_data['Data_Source'] = 'Polygon' if len(new_data) > 0 else 'Yahoo_Backup'
                    else:
                        new_data['Data_Source'] = 'Yahoo_Primary'
                
                return new_data
                
            except Exception as e:
                print(f"        ❌ Error in data fetch: {str(e)}")
                return None
        
        def save_updated_data(historical_data, new_data, compressed_file):
            """Save updated historical data with compression"""
            try:
                if new_data is None or len(new_data) == 0:
                    return True
                
                if historical_data is not None:
                    combined_data = pd.concat([historical_data, new_data], ignore_index=True)
                else:
                    combined_data = new_data
                
                combined_data = combined_data.sort_values('Date').drop_duplicates(subset=['Date'], keep='last')
                
                with gzip.open(compressed_file, 'wt') as f:
                    combined_data.to_csv(f, index=False)
                
                compressed_size = os.path.getsize(compressed_file) / 1024
                print(f"        💾 Saved {len(combined_data)} total records ({compressed_size:.1f} KB)")
                return True
                
            except Exception as e:
                print(f"        ❌ Save error: {str(e)}")
                return False
        
        def generate_fibonacci_levels_for_display(reference_close, atr):
            """Generate Fibonacci levels using EXACT same logic as daily_atr_updater.py"""
            # Use the same ratios as your existing system
            fib_ratios = [1.0, 0.786, 0.618, 0.5, 0.382, 0.236, 0.0,
                          -0.236, -0.382, -0.5, -0.618, -0.786, -1.0]
            
            levels = {}
            for ratio in fib_ratios:
                level_price = reference_close + (ratio * atr)
                
                # Use the EXACT format from daily_atr_updater.py
                levels[f"{ratio:+.3f}"] = round(level_price, 2)
                
                # Also add ATR_ format for analyzer compatibility
                if ratio == 0.0:
                    levels['ATR_000'] = round(level_price, 2)
                    levels['Daily_Close'] = round(level_price, 2)
                elif ratio > 0:
                    ratio_str = f"{int(ratio*1000):03d}"
                    levels[f'ATR_{ratio_str}'] = round(level_price, 2)
                else:
                    ratio_str = f"{int(abs(ratio)*1000):03d}"  
                    levels[f'ATR_neg{ratio_str}'] = round(level_price, 2)
            
            # Add the ATR value itself for reference
            levels['Daily_ATR'] = round(atr, 2)
            
            return levels
        
        def load_intraday_data(intraday_file):
            """Load existing intraday data with timezone normalization"""
            if not os.path.exists(intraday_file):
                return None
                
            try:
                with gzip.open(intraday_file, 'rt') as f:
                    data = pd.read_csv(f)
                
                # Convert and normalize datetime column
                data['Datetime'] = pd.to_datetime(data['Datetime'])
                
                # Normalize timezone - convert to naive datetime for consistency
                if hasattr(data['Datetime'].iloc[0], 'tz') and data['Datetime'].iloc[0].tz is not None:
                    print(f"        🔧 Removing timezone info from existing intraday data")
                    data['Datetime'] = data['Datetime'].dt.tz_localize(None)
                
                return data
            except Exception as e:
                print(f"        ⚠️ Error loading existing intraday data: {str(e)}")
                return None
        
        def detect_intraday_data_format(existing_intraday):
            """Detect whether existing intraday data has levels or is raw OHLC"""
            if existing_intraday is None or len(existing_intraday) == 0:
                return 'new_dataset'
            
            # Check for your actual level column formats
            level_columns = [col for col in existing_intraday.columns if col.startswith('ATR_')]
            has_daily_atr = 'Daily_ATR' in existing_intraday.columns
            has_daily_close = 'Daily_Close' in existing_intraday.columns
            has_signed_levels = any(col for col in existing_intraday.columns if col.startswith(('+', '-')))
            
            if level_columns or has_daily_atr or has_daily_close or has_signed_levels:
                return 'analysis_ready'
            else:
                return 'raw_ohlc'
        
        def attach_levels_to_intraday_bars(new_intraday_bars, fibonacci_levels):
            """Attach pre-calculated levels to new 10-minute bars"""
            if new_intraday_bars is None or len(new_intraday_bars) == 0:
                return new_intraday_bars
            
            # Add level columns to each bar
            for level_name, level_value in fibonacci_levels.items():
                new_intraday_bars[level_name] = level_value
            
            return new_intraday_bars
        
        def fetch_intraday_from_yahoo(yf_symbol, start_date, end_date):
            """Fetch 5-minute intraday data from Yahoo Finance and resample to 10-minute with timezone handling"""
            try:
                # Yahoo Finance intraday is limited to recent periods
                max_days = min(60, (end_date - start_date).days + 1)
                actual_start = end_date - timedelta(days=max_days)
                
                yf_ticker = yf.Ticker(yf_symbol)
                
                print(f"        📊 Fetching 5-minute data from Yahoo Finance...")
                data = yf_ticker.history(
                    start=actual_start,
                    end=end_date + timedelta(days=1),
                    interval="5m"
                )
                
                if data.empty:
                    print(f"        ⚠️ No 5-minute data available from Yahoo")
                    return None
                
                # Process data with timezone normalization
                data = data.reset_index()
                if isinstance(data.columns, pd.MultiIndex):
                    data.columns = data.columns.get_level_values(0)
                
                # Rename to match our format
                data = data.rename(columns={'Date': 'Datetime'})
                
                standard_columns = ['Datetime', 'Open', 'High', 'Low', 'Close', 'Volume']
                available_columns = [col for col in standard_columns if col in data.columns]
                data = data[available_columns]
                data['Datetime'] = pd.to_datetime(data['Datetime'])
                
                # Critical fix: Normalize timezone to avoid comparison errors
                if hasattr(data['Datetime'].iloc[0], 'tz') and data['Datetime'].iloc[0].tz is not None:
                    print(f"        🔧 Normalizing timezone from Yahoo Finance intraday data")
                    data['Datetime'] = data['Datetime'].dt.tz_localize(None)
                
                print(f"        📊 Retrieved {len(data)} 5-minute bars, resampling to 10-minute...")
                
                # Resample 5-minute data to 10-minute
                resampled_data = resample_to_10min(data)
                
                if resampled_data is not None and len(resampled_data) > 0:
                    print(f"        ✅ Resampled to {len(resampled_data)} 10-minute bars")
                    return resampled_data
                else:
                    print(f"        ❌ Resampling failed")
                    return None
                
            except Exception as e:
                print(f"        ❌ Yahoo intraday error: {str(e)}")
                return None
        
        def resample_to_10min(data_5min):
            """Resample 5-minute OHLC data to 10-minute OHLC data"""
            try:
                if data_5min is None or len(data_5min) == 0:
                    return None
                
                # Set datetime as index for resampling
                data_5min = data_5min.set_index('Datetime')
                
                # Resample to 10-minute intervals
                resampled = data_5min.resample('10T').agg({
                    'Open': 'first',
                    'High': 'max', 
                    'Low': 'min',
                    'Close': 'last',
                    'Volume': 'sum'
                })
                
                # Remove rows where we don't have complete data
                resampled = resampled.dropna()
                
                # Reset index to get Datetime back as column
                resampled = resampled.reset_index()
                
                print(f"        🔄 Resampling: {len(data_5min)} 5-min → {len(resampled)} 10-min bars")
                
                return resampled
                
            except Exception as e:
                print(f"        ❌ Resampling error: {str(e)}")
                return None
        
        def process_intraday_data_with_levels(ticker_key, yf_symbol, target_date, previous_close, current_atr):
            """Process 10-minute intraday data with intelligent level attachment and robust timezone handling"""
            try:
                # Create intraday directory structure
                intraday_dir = "historical_data/intraday"
                os.makedirs(intraday_dir, exist_ok=True)
                
                # Load existing intraday data
                intraday_file = f"{intraday_dir}/{ticker_key}_intraday_10min.csv.gz"
                existing_intraday = load_intraday_data(intraday_file)
                
                # Detect current data format
                data_format = detect_intraday_data_format(existing_intraday)
                print(f"        📊 Detected intraday format: {data_format}")
                
                # Determine date range for intraday fetch
                if existing_intraday is not None and len(existing_intraday) > 0:
                    # Ensure existing data datetime is timezone-naive for comparison
                    last_intraday_datetime = existing_intraday['Datetime'].max()
                    if hasattr(last_intraday_datetime, 'tz') and last_intraday_datetime.tz is not None:
                        last_intraday_datetime = last_intraday_datetime.tz_localize(None)
                    last_intraday_date = last_intraday_datetime.date()
                    start_date = last_intraday_date
                else:
                    # If no existing data, get recent days
                    start_date = target_date - timedelta(days=7)
                
                # Fetch new intraday data (simplified for Yahoo Finance only for now)
                new_intraday = fetch_intraday_from_yahoo(yf_symbol, start_date, target_date)
                
                if new_intraday is None or len(new_intraday) == 0:
                    print(f"        ⚠️ No new intraday data available")
                    return existing_intraday is not None
                
                # Ensure new intraday data is timezone-naive
                if hasattr(new_intraday['Datetime'].iloc[0], 'tz') and new_intraday['Datetime'].iloc[0].tz is not None:
                    print(f"        🔧 Normalizing new intraday data timezone")
                    new_intraday['Datetime'] = new_intraday['Datetime'].dt.tz_localize(None)
                
                # Handle level attachment based on existing data format
                if data_format == 'analysis_ready':
                    print(f"        🔢 Calculating and attaching levels to new bars...")
                    
                    # Generate levels using display calculation logic
                    fibonacci_levels = generate_fibonacci_levels_for_display(previous_close, current_atr)
                    
                    # Attach levels to new bars
                    new_intraday = attach_levels_to_intraday_bars(new_intraday, fibonacci_levels)
                    
                    print(f"        ✅ Added {len(fibonacci_levels)} level columns to {len(new_intraday)} bars")
                    
                elif data_format == 'raw_ohlc':
                    print(f"        📊 Maintaining raw OHLC format (no levels added)")
                    # Don't add levels - keep existing format
                    
                # Combine and save with timezone-aware handling
                if existing_intraday is not None:
                    # Ensure both dataframes have compatible datetime types
                    if hasattr(existing_intraday['Datetime'].iloc[0], 'tz') and existing_intraday['Datetime'].iloc[0].tz is not None:
                        existing_intraday['Datetime'] = existing_intraday['Datetime'].dt.tz_localize(None)
                    
                    combined_intraday = pd.concat([existing_intraday, new_intraday], ignore_index=True)
                else:
                    combined_intraday = new_intraday
                
                # Remove duplicates and sort
                combined_intraday = combined_intraday.drop_duplicates(subset=['Datetime'], keep='last')
                combined_intraday = combined_intraday.sort_values('Datetime')
                
                # Save compressed intraday data
                with gzip.open(intraday_file, 'wt') as f:
                    combined_intraday.to_csv(f, index=False)
                
                compressed_size = os.path.getsize(intraday_file) / 1024  # KB
                new_records = len(new_intraday)
                total_records = len(combined_intraday)
                
                if data_format == 'analysis_ready':
                    print(f"        ✅ Analysis-ready data: +{new_records} bars ({total_records} total, {compressed_size:.1f} KB)")
                else:
                    print(f"        ✅ Raw OHLC data: +{new_records} bars ({total_records} total, {compressed_size:.1f} KB)")
                
                return True
                
            except Exception as e:
                print(f"        ❌ Intraday processing error: {str(e)}")
                return False
        
        def process_ticker_with_levels(ticker_key, ticker_config, target_date, phase):
            """Enhanced ticker processing with ATR + levels integration"""
            print(f"   🔄 Processing {ticker_key} ({phase})...")
            
            yf_symbol = ticker_config.get('yf_symbol', ticker_key)
            if yf_symbol != ticker_key:
                print(f"      🔄 Using mapped symbol: {ticker_key} -> {yf_symbol}")
            
            try:
                # === DAILY DATA PROCESSING ===
                print(f"      📊 Processing daily data...")
                
                # Load existing daily data
                historical_data, compressed_file = load_historical_data(ticker_key)
                
                # Determine last date
                last_date = None
                if historical_data is not None and len(historical_data) > 0:
                    last_date = historical_data['Date'].max()
                
                # Fetch new daily data
                new_daily_data = fetch_new_daily_data(ticker_key, yf_symbol, target_date, last_date)
                
                # Update historical daily data
                if not save_updated_data(historical_data, new_daily_data, compressed_file):
                    return {'status': 'error', 'error': 'Failed to save daily data'}
                
                # Reload for ATR calculation
                updated_data, _ = load_historical_data(ticker_key)
                if updated_data is None:
                    return {'status': 'error', 'error': 'Failed to reload daily data'}
                
                # === ATR CALCULATION & LEVEL GENERATION ===
                print(f"      🔢 Calculating ATR and levels...")
                
                # Bootstrap ATR column if missing
                if 'ATR' not in updated_data.columns:
                    print(f"      🔧 Bootstrapping ATR column...")
                    updated_data['ATR'] = calculate_atr(updated_data)
                    
                    # Save with ATR column
                    with gzip.open(compressed_file, 'wt') as f:
                        updated_data.to_csv(f, index=False)
                else:
                    # Calculate incremental ATR
                    updated_data['ATR'] = calculate_atr(updated_data)
                    
                    # Save updated data with ATR
                    with gzip.open(compressed_file, 'wt') as f:
                        updated_data.to_csv(f, index=False)
                
                # Get reference values for level calculation
                latest_row = updated_data.iloc[-1]
                previous_row = updated_data.iloc[-2] if len(updated_data) > 1 else latest_row
                
                current_atr = latest_row['ATR']
                previous_close = previous_row['Close']  # Reference point (0.000)
                current_close = latest_row['Close']
                reference_date = latest_row['Date']
                
                if pd.isna(current_atr):
                    return {'status': 'error', 'error': 'ATR calculation failed'}
                
                print(f"      ✅ Daily success: Close=${current_close:.2f}, ATR=${current_atr:.2f}")
                print(f"      🎯 Reference: Previous close=${previous_close:.2f} (0.000 level)")
                
                # === INTRADAY DATA PROCESSING WITH LEVELS ===
                print(f"      📈 Processing 10-minute intraday data with levels...")
                
                intraday_result = process_intraday_data_with_levels(
                    ticker_key, yf_symbol, target_date, previous_close, current_atr
                )
                intraday_status = "success" if intraday_result else "failed"
                
                print(f"      📈 Intraday result: {intraday_status}")
                
                return {
                    'status': 'success',
                    'reference_close': float(current_close),
                    'reference_atr': float(current_atr),
                    'previous_close': float(previous_close),
                    'reference_date': str(reference_date),
                    'last_updated': datetime.now().isoformat(),
                    'yf_symbol': yf_symbol,
                    'data_points': len(updated_data),
                    'processing_phase': phase,
                    'intraday_status': intraday_status,
                    'data_source': new_daily_data.get('Data_Source', 'No_New_Data').iloc[0] if new_daily_data is not None and len(new_daily_data) > 0 else 'No_New_Data'
                }
                
            except Exception as e:
                print(f"      ❌ Error: {str(e)}")
                return {'status': 'error', 'error': str(e)}
        
        def get_target_date(phase):
            """Get target date based on execution phase"""
            eastern = pytz.timezone('US/Eastern')
            now_eastern = datetime.now(eastern)
            
            if phase == 'gap_detection':
                return (now_eastern - timedelta(days=1)).date()
            
            if now_eastern.hour < 6:
                target_date = (now_eastern - timedelta(days=2)).date()
            else:
                target_date = (now_eastern - timedelta(days=1)).date()
            
            return target_date
        
        def main():
            """Main processing function with enhanced levels support"""
            # Load phase from previous step
            try:
                with open('execution_phase.txt', 'r') as f:
                    phase = f.read().strip()
            except:
                phase = 'primary'
            
            print(f"🎯 Enhanced Levels Processor - Phase: {phase}")
