name: Three-Phase Smart ATR System

# Market-aware three-phase execution with asset class separation
on:
  schedule:
    # PHASE 1: 5:30 PM EST/EDT - Primary run (stocks, ETFs, futures - NO crypto)
    - cron: '30 22 * * 1-5'  # Mon-Fri 5:30 PM EST (22:30 UTC)
    - cron: '30 21 * * 1-5'  # Mon-Fri 5:30 PM EDT (21:30 UTC)
    
    # PHASE 2: 8:05 PM EST/EDT - Crypto + retry run (DAILY - includes weekends for crypto)
    - cron: '5 1 * * *'      # Daily 8:05 PM EST (01:05 UTC next day)
    - cron: '5 0 * * *'      # Daily 8:05 PM EDT (00:05 UTC next day)
    
    # PHASE 3: 12:30 AM EST/EDT - Final cleanup (WEEKDAYS ONLY)
    - cron: '30 5 * * 2-6'  # Tue-Sat 12:30 AM EST (05:30 UTC) - covers Mon-Fri trading
    - cron: '30 4 * * 2-6'  # Tue-Sat 12:30 AM EDT (04:30 UTC)
  
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      execution_phase:
        description: 'Execution Phase'
        required: false
        default: 'primary'
        type: choice
        options:
          - 'primary'
          - 'crypto_retry'
          - 'final_cleanup'
          - 'manual_test'
      polygon_api_key:
        description: 'Polygon API Key (optional)'
        required: false
        type: string

jobs:
  three-phase-atr:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz requests numpy
    
    - name: Determine Execution Phase and Asset Classes
      timeout-minutes: 2
      run: |
        echo "🕐 Determining execution phase and target asset classes..."
        
        cat > phase_detector.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import os
        from datetime import datetime, timedelta
        import pytz
        
        def classify_asset_type(ticker):
            """Classify ticker by asset type"""
            ticker = ticker.upper()
            
            # Crypto patterns
            crypto_patterns = [
                ticker.endswith('-USD'),
                ticker.endswith('USD') and len(ticker) > 3,
                ticker.endswith('-BTC'),
                ticker.endswith('-ETH'),
                ticker in ['BTC', 'ETH', 'ADA', 'SOL', 'DOGE', 'XRP', 'DOT', 'AVAX', 'MATIC', 'LINK']
            ]
            if any(crypto_patterns):
                return 'crypto'
            
            # Futures patterns
            futures_patterns = [
                ticker in ['ES', 'NQ', 'YM', 'RTY', 'GC', 'SI', 'CL', 'NG', 'ZN', 'ZB'],
                ticker.endswith('=F'),
                len(ticker) <= 2 and ticker.isalpha()  # Two-letter futures codes
            ]
            if any(futures_patterns):
                return 'futures'
            
            # Default to traditional (stocks, ETFs, indices)
            return 'traditional'
        
        def determine_execution_phase():
            """Determine execution phase with market-aware scheduling"""
            
            # Check for manual override
            manual_phase = os.getenv('GITHUB_EVENT_NAME') == 'workflow_dispatch'
            if manual_phase:
                phase = os.getenv('INPUT_EXECUTION_PHASE', 'manual_test')
                print(f"🔧 Manual execution: {phase}")
                return phase
            
            # Determine phase based on current time and day
            eastern = pytz.timezone('US/Eastern')
            now = datetime.now(eastern)
            hour = now.hour
            weekday = now.weekday()  # 0=Monday, 6=Sunday
            is_weekend = weekday >= 5
            
            # Phase detection based on cron schedule times
            if 17 <= hour < 20:  # 5:30 PM - 8:00 PM
                if is_weekend:
                    phase = 'weekend_skip'
                else:
                    phase = 'primary'  # Weekday primary run
                    
            elif 20 <= hour < 24 or hour == 0:  # 8:05 PM - 12:30 AM
                phase = 'crypto_retry'  # Daily crypto + weekday retries
                
            elif 0 <= hour < 6:   # 12:30 AM - 6:00 AM
                if is_weekend:
                    phase = 'weekend_skip'
                else:
                    phase = 'final_cleanup'  # Weekday final cleanup
            else:
                phase = 'gap_detection'  # Fallback/maintenance
            
            print(f"🕐 Time-based execution: {phase} (hour: {hour}, weekend: {is_weekend})")
            return phase
        
        def get_target_asset_classes(phase):
            """Determine which asset classes to target based on phase"""
            eastern = pytz.timezone('US/Eastern')
            is_weekend = datetime.now(eastern).weekday() >= 5
            
            if phase == 'primary':
                # Phase 1: Traditional markets only (stocks, ETFs, futures)
                return ['traditional', 'futures']
                
            elif phase == 'crypto_retry':
                if is_weekend:
                    # Weekend: Crypto only
                    return ['crypto']
                else:
                    # Weekday: Crypto + retry traditional/futures
                    return ['crypto', 'traditional', 'futures']
                    
            elif phase == 'final_cleanup':
                # Phase 3: Everything (final attempt)
                return ['crypto', 'traditional', 'futures']
                
            elif phase == 'manual_test':
                # Manual: Everything for testing
                return ['crypto', 'traditional', 'futures']
                
            else:
                return []
        
        def load_retry_status():
            """Load retry status from previous phases"""
            try:
                with open('retry_status.json', 'r') as f:
                    return json.load(f)
            except:
                return {}
        
        def main():
            phase = determine_execution_phase()
            
            if phase in ['weekend_skip']:
                print(f"⏭️ Phase {phase} - no processing needed")
                with open('execution_phase.txt', 'w') as f:
                    f.write(phase)
                with open('target_assets.json', 'w') as f:
                    json.dump([], f)
                return 0
            
            target_classes = get_target_asset_classes(phase)
            retry_status = load_retry_status()
            
            print(f"📋 Execution Summary:")
            print(f"   🕐 Phase: {phase}")
            print(f"   🎯 Target asset classes: {target_classes}")
            print(f"   🔄 Retry data available: {len(retry_status)} entries")
            
            # Save phase info for subsequent steps
            with open('execution_phase.txt', 'w') as f:
                f.write(phase)
            
            with open('target_assets.json', 'w') as f:
                json.dump(target_classes, f)
            
            return 0
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python phase_detector.py
        
        # Set environment variables for subsequent steps
        PHASE=$(cat execution_phase.txt)
        echo "EXECUTION_PHASE=$PHASE" >> $GITHUB_ENV
        echo "✅ Phase detection completed: $PHASE"

    - name: Discovery and Asset Classification
      timeout-minutes: 3
      run: |
        echo "🔍 Discovering tickers and classifying by asset type..."
        echo "📊 Phase: $EXECUTION_PHASE"
        
        cat > asset_discovery.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import glob
        import re
        import yfinance as yf
        import time
        from datetime import datetime
        
        def classify_asset_type(ticker):
            """Classify ticker by asset type"""
            ticker = ticker.upper()
            
            # Crypto patterns
            crypto_patterns = [
                ticker.endswith('-USD'),
                ticker.endswith('USD') and len(ticker) > 3,
                ticker.endswith('-BTC'),
                ticker.endswith('-ETH'),
                ticker in ['BTC', 'ETH', 'ADA', 'SOL', 'DOGE', 'XRP', 'DOT', 'AVAX', 'MATIC', 'LINK']
            ]
            if any(crypto_patterns):
                return 'crypto'
            
            # Futures patterns
            futures_patterns = [
                ticker in ['ES', 'NQ', 'YM', 'RTY', 'GC', 'SI', 'CL', 'NG', 'ZN', 'ZB'],
                ticker.endswith('=F'),
                len(ticker) <= 2 and ticker.isalpha()
            ]
            if any(futures_patterns):
                return 'futures'
            
            # Default to traditional
            return 'traditional'
        
        def extract_ticker_from_filename(filename):
            """Extract ticker from various filename patterns"""
            patterns = [
                r'atr_summary_([A-Z]+)_',
                r'atr_level_totals_([A-Z]+)_',
                r'statecheck_detailed_([A-Z]+)_',
                r'zonebaseline_detailed_([A-Z]+)_',
                r'zonebaseline_hourly_([A-Z]+)_',
                r'([A-Z]+)_historical_',
                r'([A-Z]+)_intraday_'
            ]
            
            for pattern in patterns:
                match = re.search(pattern, filename)
                if match:
                    return match.group(1)
            return None
        
        def discover_existing_tickers():
            """Discover tickers from existing repository files"""
            print("🔍 Scanning repository for existing ticker files...")
            
            # Get all CSV files and compressed files
            csv_files = glob.glob("*.csv") + glob.glob("**/*.csv", recursive=True)
            gz_files = glob.glob("**/*.gz", recursive=True)
            
            all_files = csv_files + gz_files
            
            discovered_tickers = set()
            for file_path in all_files:
                ticker = extract_ticker_from_filename(file_path)
                if ticker and len(ticker) <= 10:  # Reasonable ticker length
                    discovered_tickers.add(ticker)
            
            print(f"📁 Found {len(discovered_tickers)} unique tickers: {sorted(discovered_tickers)}")
            return sorted(discovered_tickers)
        
        def create_ticker_mapping(ticker):
            """Create Yahoo Finance symbol mapping"""
            mapping = {
                'SPX': '^GSPC',     # S&P 500 Index
                'ES': 'ES=F',       # E-mini S&P 500 Futures
                'NQ': 'NQ=F',       # E-mini NASDAQ Futures  
                'YM': 'YM=F',       # E-mini Dow Futures
                'RTY': 'RTY=F',     # E-mini Russell 2000 Futures
                'GC': 'GC=F',       # Gold Futures
                'CL': 'CL=F',       # Crude Oil Futures
                'ZN': 'ZN=F',       # 10-Year Treasury Note Futures
                'VIX': '^VIX',      # CBOE Volatility Index
                'DXY': 'DX=F',      # US Dollar Index Futures
                'BTC': 'BTC-USD',   # Bitcoin
                'ETH': 'ETH-USD'    # Ethereum
            }
            return mapping.get(ticker, ticker)
        
        def validate_ticker_data(ticker, yf_symbol):
            """Quick validation that ticker has data available"""
            try:
                yf_ticker = yf.Ticker(yf_symbol)
                test_data = yf_ticker.history(period="5d")
                
                if test_data.empty:
                    return False
                
                # Basic data quality check
                if len(test_data) < 2:
                    return False
                    
                return True
                
            except Exception as e:
                print(f"      ⚠️ {ticker}: Validation error - {e}")
                return False
        
        def main():
            print("🚀 Asset Discovery and Classification")
            print("=" * 50)
            
            # Load target asset classes from previous step
            try:
                with open('target_assets.json', 'r') as f:
                    target_classes = json.load(f)
            except:
                target_classes = ['traditional', 'futures', 'crypto']
            
            if not target_classes:
                print("⏭️ No asset classes to process")
                with open('discovered_tickers.json', 'w') as f:
                    json.dump({'tickers': {}}, f)
                return 0
            
            print(f"🎯 Target asset classes: {target_classes}")
            
            # Discover all tickers
            discovered_tickers = discover_existing_tickers()
            
            if not discovered_tickers:
                print("❌ No tickers discovered")
                return 1
            
            # Classify and filter by target asset classes
            valid_tickers = {}
            
            for ticker in discovered_tickers:
                asset_type = classify_asset_type(ticker)
                
                # Skip if not in target classes for this phase
                if asset_type not in target_classes:
                    print(f"   ⏭️ {ticker}: Skipping {asset_type} (not in target classes)")
                    continue
                
                print(f"   🔄 Testing {ticker} ({asset_type})...")
                yf_symbol = create_ticker_mapping(ticker)
                
                if validate_ticker_data(ticker, yf_symbol):
                    valid_tickers[ticker] = {
                        'ticker': ticker,
                        'yf_symbol': yf_symbol,
                        'asset_type': asset_type,
                        'data_available': True,
                        'discovered_at': datetime.now().isoformat()
                    }
                    print(f"      ✅ {ticker}: Available ({asset_type})")
                else:
                    print(f"      ❌ {ticker}: No data available")
                
                # Rate limiting
                time.sleep(0.3)
            
            # Save discovered and classified tickers
            config = {
                'discovered_at': datetime.now().isoformat(),
                'method': 'three_phase_asset_discovery',
                'target_classes': target_classes,
                'tickers': valid_tickers
            }
            
            with open('discovered_tickers.json', 'w') as f:
                json.dump(config, f, indent=2)
            
            print(f"\n✅ Discovery complete: {len(valid_tickers)} valid tickers for target classes")
            
            # Breakdown by asset type
            by_type = {}
            for ticker, info in valid_tickers.items():
                asset_type = info['asset_type']
                by_type.setdefault(asset_type, []).append(ticker)
            
            for asset_type, tickers in by_type.items():
                print(f"   📊 {asset_type.upper()}: {tickers}")
            
            return 0
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python asset_discovery.py
        echo "✅ Asset discovery and classification completed"

    - name: Load Retry Status and Plan Processing
      timeout-minutes: 2
      run: |
        echo "📋 Loading retry status and planning processing targets..."
        echo "📊 Phase: $EXECUTION_PHASE"
        
        cat > processing_planner.py << 'EOF'
        #!/usr/bin/env python3
        import json
        from datetime import datetime, date
        
        def load_retry_status():
            """Load previous phase failure status"""
            try:
                with open('retry_status.json', 'r') as f:
                    return json.load(f)
            except:
                return {}
        
        def load_discovered_tickers():
            """Load discovered and classified tickers"""
            try:
                with open('discovered_tickers.json', 'r') as f:
                    config = json.load(f)
                return config.get('tickers', {})
            except:
                return {}
        
        def plan_processing_targets(phase, discovered_tickers, retry_status):
            """Plan which tickers to process based on phase and retry status"""
            
            # Load phase from file
            try:
                with open('execution_phase.txt', 'r') as f:
                    phase = f.read().strip()
            except:
                phase = 'primary'
            
            targets = {}
            today_str = date.today().isoformat()
            
            if phase == 'primary':
                # Phase 1: All discovered traditional/futures tickers
                for ticker, config in discovered_tickers.items():
                    targets[ticker] = {**config, 'retry_reason': 'primary_attempt'}
                    
            elif phase == 'crypto_retry':
                # Phase 2: Crypto + retry failed traditional/futures
                
                # Add all crypto
                for ticker, config in discovered_tickers.items():
                    if config.get('asset_type') == 'crypto':
                        targets[ticker] = {**config, 'retry_reason': 'crypto_primary'}
                
                # Add failed traditional/futures from Phase 1
                phase1_failures = retry_status.get(today_str, {}).get('phase1_failures', [])
                for ticker in phase1_failures:
                    if ticker in discovered_tickers:
                        targets[ticker] = {**discovered_tickers[ticker], 'retry_reason': 'phase1_retry'}
                        
            elif phase == 'final_cleanup':
                # Phase 3: All remaining failures
                remaining_failures = retry_status.get(today_str, {}).get('phase2_failures', [])
                for ticker in remaining_failures:
                    if ticker in discovered_tickers:
                        targets[ticker] = {**discovered_tickers[ticker], 'retry_reason': 'final_cleanup'}
                        
            elif phase == 'manual_test':
                # Manual: All discovered tickers
                for ticker, config in discovered_tickers.items():
                    targets[ticker] = {**config, 'retry_reason': 'manual_test'}
            
            return targets
        
        def main():
            print("📋 Processing Planning")
            print("=" * 30)
            
            # Load data
            discovered_tickers = load_discovered_tickers()
            retry_status = load_retry_status()
            
            # Load phase
            try:
                with open('execution_phase.txt', 'r') as f:
                    phase = f.read().strip()
            except:
                phase = 'primary'
            
            if not discovered_tickers:
                print("❌ No discovered tickers - nothing to process")
                with open('processing_targets.json', 'w') as f:
                    json.dump({}, f)
                with open('should_process.txt', 'w') as f:
                    f.write('false')
                return 0
            
            # Plan processing targets
            targets = plan_processing_targets(phase, discovered_tickers, retry_status)
            
            # Save processing plan
            with open('processing_targets.json', 'w') as f:
                json.dump(targets, f, indent=2)
            
            # Set processing flag
            should_process = len(targets) > 0
            with open('should_process.txt', 'w') as f:
                f.write('true' if should_process else 'false')
            
            # Summary
            print(f"📊 Processing Plan Summary:")
            print(f"   🕐 Phase: {phase}")
            print(f"   🎯 Targets: {len(targets)} tickers")
            print(f"   📋 Previous failures in retry_status: {len(retry_status)} entries")
            
            if targets:
                # Breakdown by retry reason
                by_reason = {}
                for ticker, info in targets.items():
                    reason = info.get('retry_reason', 'unknown')
                    by_reason.setdefault(reason, []).append(ticker)
                
                for reason, tickers in by_reason.items():
                    print(f"   📌 {reason}: {tickers}")
            else:
                print("   ✅ No targets identified - will skip processing")
            
            return 0
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python processing_planner.py
        echo "✅ Processing planning completed"

    - name: Three-Phase ATR Data Processing
      timeout-minutes: 20
      env:
        POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || inputs.polygon_api_key }}
      run: |
        # Check if we should process
        SHOULD_PROCESS=$(cat should_process.txt)
        if [ "$SHOULD_PROCESS" = "false" ]; then
          echo "⏭️ No targets identified - skipping data processing"
          exit 0
        fi
        
        echo "🔄 Starting three-phase ATR data processing..."
        echo "📊 Phase: $EXECUTION_PHASE"
        echo "⏰ Processing start time: $(date)"
        
        cat > three_phase_processor.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import yfinance as yf
        import pandas as pd
        import numpy as np
        import gzip
        import os
        from datetime import datetime, timedelta, date
        import pytz
        
        def get_target_date_for_market():
            """Get target date for market data - most recent trading day"""
            eastern = pytz.timezone('US/Eastern')
            now_eastern = datetime.now(eastern)
            
            # Simple logic: Always target most recent trading day with closed data
            if now_eastern.hour >= 16:  # After 4 PM
                target_date = now_eastern.date()
            else:  # Before 4 PM or overnight
                target_date = (now_eastern - timedelta(days=1)).date()
            
            print(f"        🎯 Target date: {target_date} (most recent trading day)")
            return target_date
        
        def calculate_true_wilders_atr(df, period=14):
            """Calculate TRUE Wilder's ATR exactly matching daily_atr_updater.py methodology"""
            if len(df) < period:
                return pd.Series([np.nan] * len(df), index=df.index)
            
            # Calculate True Range components exactly like proven system
            df_copy = df.copy()
            df_copy["Prev_Close"] = df_copy["Close"].shift(1)
            
            # Calculate True Range for each row
            def calculate_true_range_row(row):
                if pd.isna(row["Prev_Close"]):
                    return row["High"] - row["Low"]
                
                return max(
                    row["High"] - row["Low"],
                    abs(row["High"] - row["Prev_Close"]),
                    abs(row["Low"] - row["Prev_Close"])
                )
            
            df_copy["TR"] = df_copy.apply(calculate_true_range_row, axis=1)
            
            # Calculate TRUE Wilder's ATR using EXACT same logic as daily_atr_updater.py
            atr_values = [None] * len(df_copy)
            
            for i in range(len(df_copy)):
                if i < period - 1:
                    # No ATR until we have enough data
                    atr_values[i] = None
                elif i == period - 1:
                    # First ATR = average of first 14 TR values
                    atr_values[i] = df_copy["TR"].iloc[0:i+1].mean()
                else:
                    # Subsequent ATR = 1/14*current_TR + (1-1/14)*previous_ATR
                    prev_atr = atr_values[i-1]
                    current_tr = df_copy["TR"].iloc[i]
                    atr_values[i] = (1/period) * current_tr + (1 - 1/period) * prev_atr
            
            return pd.Series(atr_values, index=df.index)
        
        def load_historical_data(ticker_key):
            """Load existing compressed historical data with robust date handling"""
            historical_dir = "historical_data"
            os.makedirs(historical_dir, exist_ok=True)
            
            # Use existing filename pattern: {ticker}_historical.csv.gz
            compressed_file = f"{historical_dir}/{ticker_key}_historical.csv.gz"
            
            if os.path.exists(compressed_file):
                try:
                    with gzip.open(compressed_file, 'rt') as f:
                        df = pd.read_csv(f)
                    
                    # Robust date parsing with timezone handling
                    try:
                        df['Date'] = pd.to_datetime(df['Date'], utc=True).dt.tz_localize(None).dt.date
                    except (ValueError, AttributeError, TypeError):
                        try:
                            # Fallback: Force string conversion first
                            df['Date'] = pd.to_datetime(df['Date'].astype(str), errors='coerce', utc=True).dt.tz_localize(None).dt.date
                        except:
                            print(f"        🔧 Using manual date parsing for {ticker_key}")
                            df['Date'] = df['Date'].apply(lambda x: pd.to_datetime(str(x), errors='coerce', utc=True).tz_localize(None).date() if pd.notna(x) else None)
                    
                    # Remove any rows with failed date parsing
                    df = df.dropna(subset=['Date'])
                    
                    print(f"        📊 Loaded {len(df)} historical records")
                    return df, compressed_file
                except Exception as e:
                    print(f"        ❌ Error loading {compressed_file}: {e}")
            
            return None, compressed_file
        
        def fetch_new_data(ticker_key, yf_symbol, target_date, last_date_in_data=None):
            """Fetch new data with smart fallback logic"""
            try:
                if last_date_in_data:
                    start_date = last_date_in_data + timedelta(days=1)
                    if start_date > target_date:
                        print(f"        ✅ Data is current")
                        return None
                    print(f"        📅 Fetching incremental: {start_date} to {target_date}")
                    
                    # Incremental fetch
                    yf_ticker = yf.Ticker(yf_symbol)
                    data = yf_ticker.history(start=start_date, end=target_date + timedelta(days=1))
                    
                else:
                    print(f"        📅 Initial fetch: using period='6mo' (matches proven system)")
                    
                    # Initial fetch using EXACT same method as daily_atr_updater.py
                    yf_ticker = yf.Ticker(yf_symbol)
                    data = yf_ticker.history(period="6mo")
                
                if data.empty:
                    return None
                
                # Process data consistently
                data = data.reset_index()
                if isinstance(data.columns, pd.MultiIndex):
                    data.columns = data.columns.get_level_values(0)
                
                # Normalize datetime
                data['Date'] = pd.to_datetime(data['Date'])
                if hasattr(data['Date'].iloc[0], 'tz') and data['Date'].iloc[0].tz is not None:
                    data['Date'] = data['Date'].dt.tz_localize(None)
                
                # Add metadata
                data['Ticker'] = ticker_key
                data['YF_Symbol'] = yf_symbol
                data['Downloaded_At'] = datetime.now().isoformat()
                data['Data_Source'] = 'Yahoo_Finance'
                
                print(f"        ✅ Successfully fetched {len(data)} records")
                return data
                
            except Exception as e:
                print(f"        ❌ Data fetch error: {str(e)}")
                return None
        
        def save_updated_data(historical_data, new_data, compressed_file):
            """Save updated historical data with compression and proper date handling"""
            try:
                if new_data is None or len(new_data) == 0:
                    return True
                
                if historical_data is not None:
                    combined_data = pd.concat([historical_data, new_data], ignore_index=True)
                else:
                    combined_data = new_data
                
                # Fix date type consistency before sorting
                # Convert all dates to same type (date objects)
                if 'Date' in combined_data.columns:
                    combined_data['Date'] = pd.to_datetime(combined_data['Date']).dt.date
                
                # Now sort and deduplicate
                combined_data = combined_data.sort_values('Date').drop_duplicates(subset=['Date'], keep='last')
                
                with gzip.open(compressed_file, 'wt') as f:
                    combined_data.to_csv(f, index=False)
                
                compressed_size = os.path.getsize(compressed_file) / 1024
                print(f"        💾 Saved {len(combined_data)} total records ({compressed_size:.1f} KB)")
                return True
                
            except Exception as e:
                print(f"        ❌ Save error: {str(e)}")
                return False
        
        def generate_fibonacci_levels(reference_close, atr):
            """Generate Fibonacci levels using EXACT same logic as daily_atr_updater.py"""
            # Use the same ratios as proven system
            fib_ratios = [1.0, 0.786, 0.618, 0.5, 0.382, 0.236, 0.0,
                          -0.236, -0.382, -0.5, -0.618, -0.786, -1.0]
            
            levels = {}
            for ratio in fib_ratios:
                level_price = reference_close + (ratio * atr)
                
                # Use the EXACT format from daily_atr_updater.py
                levels[f"{ratio:+.3f}"] = round(level_price, 2)
                
                # Also add ATR_ format for analyzer compatibility
                if ratio == 0.0:
                    levels['ATR_000'] = round(level_price, 2)
                    levels['Daily_Close'] = round(level_price, 2)
                elif ratio > 0:
                    ratio_str = f"{int(ratio*1000):03d}"
                    levels[f'ATR_{ratio_str}'] = round(level_price, 2)
                else:
                    ratio_str = f"{int(abs(ratio)*1000):03d}"  
                    levels[f'ATR_neg{ratio_str}'] = round(level_price, 2)
            
            # Add the ATR value itself for reference
            levels['Daily_ATR'] = round(atr, 2)
            
            return levels
        
        def process_ticker(ticker_key, ticker_config, target_date, phase):
            """Process a single ticker with three-phase awareness"""
            retry_reason = ticker_config.get('retry_reason', 'unknown')
            asset_type = ticker_config.get('asset_type', 'unknown')
            
            print(f"   🔄 Processing {ticker_key} ({asset_type}) - {retry_reason}")
            
            yf_symbol = ticker_config.get('yf_symbol', ticker_key)
            if yf_symbol != ticker_key:
                print(f"      🔄 Using mapped symbol: {ticker_key} -> {yf_symbol}")
            
            try:
                # === DAILY DATA PROCESSING ===
                print(f"      📊 Processing daily data...")
                
                # Load existing data
                historical_data, compressed_file = load_historical_data(ticker_key)
                
                # Determine last date
                last_date = None
                if historical_data is not None and len(historical_data) > 0:
                    last_date = historical_data['Date'].max()
                    if isinstance(last_date, str):
                        last_date = pd.to_datetime(last_date).date()
                
                # Fetch new data
                new_data = fetch_new_data(ticker_key, yf_symbol, target_date, last_date)
                
                # Save updated data
                if not save_updated_data(historical_data, new_data, compressed_file):
                    return {'status': 'error', 'error': 'Failed to save daily data'}
                
                # Reload for ATR calculation
                updated_data, _ = load_historical_data(ticker_key)
                if updated_data is None:
                    return {'status': 'error', 'error': 'Failed to reload daily data'}
                
                # === ATR CALCULATION ===
                print(f"      🔢 Calculating TRUE Wilder's ATR...")
                
                # Calculate ATR using proven methodology
                updated_data['ATR'] = calculate_true_wilders_atr(updated_data)
                
                # Save data with ATR
                with gzip.open(compressed_file, 'wt') as f:
                    updated_data.to_csv(f, index=False)
                
                # Get reference values for level calculation
                valid_atr_rows = updated_data[updated_data["ATR"].notna()]
                
                if valid_atr_rows.empty:
                    return {'status': 'error', 'error': 'No valid ATR values found'}
                
                latest = updated_data.iloc[-1]
                current_close = latest["Close"]
                current_atr = latest["ATR"]
                reference_date = latest["Date"] if hasattr(latest["Date"], 'strftime') else pd.to_datetime(latest["Date"])
                
                # For previous close (0.000 reference)
                if len(valid_atr_rows) > 1:
                    previous_row = valid_atr_rows.iloc[-2]
                    previous_close = previous_row["Close"]
                else:
                    previous_close = current_close  # Fallback
                
                print(f"      ✅ Success: Close=${current_close:.2f}, ATR=${current_atr:.2f}")
                print(f"      🎯 Reference: Previous close=${previous_close:.2f} (0.000 level)")
                print(f"      📊 Valid ATR rows: {len(valid_atr_rows)}")
                
                # Generate levels for JSON cache
                levels = generate_fibonacci_levels(previous_close, current_atr)
                
                return {
                    'status': 'success',
                    'reference_close': float(current_close),
                    'reference_atr': float(current_atr),
                    'previous_close': float(previous_close),
                    'reference_date': str(reference_date.date() if hasattr(reference_date, 'date') else reference_date),
                    'last_updated': datetime.now().isoformat(),
                    'yf_symbol': yf_symbol,
                    'asset_type': asset_type,
                    'retry_reason': retry_reason,
                    'data_points': len(updated_data),
                    'valid_atr_points': len(valid_atr_rows),
                    'processing_phase': phase,
                    'levels': levels
                }
                
            except Exception as e:
                print(f"      ❌ Error: {str(e)}")
                return {'status': 'error', 'error': str(e), 'asset_type': asset_type, 'retry_reason': retry_reason}
        
        def save_retry_status(phase, results):
            """Save retry status for next phase"""
            try:
                # Load existing retry status
                try:
                    with open('retry_status.json', 'r') as f:
                        retry_status = json.load(f)
                except:
                    retry_status = {}
                
                today_str = date.today().isoformat()
                
                if today_str not in retry_status:
                    retry_status[today_str] = {}
                
                # Identify failures for next phase
                failures = [ticker for ticker, result in results.items() if result['status'] == 'error']
                
                if phase == 'primary':
                    retry_status[today_str]['phase1_failures'] = failures
                elif phase == 'crypto_retry':
                    retry_status[today_str]['phase2_failures'] = failures
                elif phase == 'final_cleanup':
                    retry_status[today_str]['phase3_failures'] = failures
                
                # Clean up old entries (keep last 7 days)
                cutoff_date = (datetime.now().date() - timedelta(days=7)).isoformat()
                retry_status = {k: v for k, v in retry_status.items() if k >= cutoff_date}
                
                # Save updated retry status
                with open('retry_status.json', 'w') as f:
                    json.dump(retry_status, f, indent=2)
                
                print(f"📝 Saved retry status: {len(failures)} failures from {phase}")
                return True
                
            except Exception as e:
                print(f"❌ Error saving retry status: {str(e)}")
                return False
        
        def save_levels_cache(results):
            """Save levels to JSON cache for future use"""
            try:
                # Load existing levels cache
                try:
                    with open('levels_cache.json', 'r') as f:
                        levels_cache = json.load(f)
                except:
                    levels_cache = {}
                
                today_str = date.today().isoformat()
                tomorrow_str = (date.today() + timedelta(days=1)).isoformat()
                
                # Save levels calculated today for use tomorrow
                if tomorrow_str not in levels_cache:
                    levels_cache[tomorrow_str] = {}
                
                for ticker, result in results.items():
                    if result['status'] == 'success' and 'levels' in result:
                        levels_cache[tomorrow_str][ticker] = {
                            'atr': result['reference_atr'],
                            'reference_close': result['previous_close'],
                            'levels': result['levels'],
                            'calculated_from': today_str,
                            'asset_type': result.get('asset_type', 'unknown')
                        }
                
                # Clean up old entries (keep last 30 days)
                cutoff_date = (datetime.now().date() - timedelta(days=30)).isoformat()
                levels_cache = {k: v for k, v in levels_cache.items() if k >= cutoff_date}
                
                # Save updated cache
                with open('levels_cache.json', 'w') as f:
                    json.dump(levels_cache, f, indent=2)
                
                successful_levels = sum(1 for r in results.values() if r['status'] == 'success')
                print(f"💾 Saved {successful_levels} level sets to cache for tomorrow")
                return True
                
            except Exception as e:
                print(f"❌ Error saving levels cache: {str(e)}")
                return False
        
        def main():
            """Main three-phase processing function"""
            # Load processing targets
            try:
                with open('processing_targets.json', 'r') as f:
                    targets = json.load(f)
            except:
                print("❌ No processing targets found")
                return 1
            
            if not targets:
                print("✅ No targets to process")
                return 0
            
            # Load phase
            try:
                with open('execution_phase.txt', 'r') as f:
                    phase = f.read().strip()
            except:
                phase = 'primary'
            
            target_date = get_target_date_for_market()
            
            print(f"🎯 Three-Phase ATR Processor - Phase: {phase}")
            print(f"📅 Target date: {target_date}")
            print(f"📊 Processing {len(targets)} tickers...")
            print("=" * 60)
            
            # Process each target
            results = {}
            
            for ticker_key, ticker_config in targets.items():
                result = process_ticker(ticker_key, ticker_config, target_date, phase)
                results[ticker_key] = result
            
            # Save retry status for next phase
            save_retry_status(phase, results)
            
            # Save levels cache for future use
            save_levels_cache(results)
            
            # Create final ATR JSON (compatibility with existing system)
            successful_results = {k: v for k, v in results.items() if v['status'] == 'success'}
            
            final_atr_data = {
                "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S %Z"),
                "last_updated_timestamp": datetime.now().timestamp(),
                "processing_method": "three_phase_system",
                "execution_phase": phase,
                "tickers": successful_results
            }
            
            # Save main ATR JSON
            with open('atr_levels.json', 'w') as f:
                json.dump(final_atr_data, f, indent=2)
            
            # Summary
            success_count = sum(1 for r in results.values() if r['status'] == 'success')
            error_count = len(results) - success_count
            
            print(f"\n📊 Three-Phase Processing Summary:")
            print(f"🎯 Phase: {phase}")
            print(f"📈 Processed: {len(results)} tickers")
            print(f"✅ Successful: {success_count}")
            print(f"❌ Failed: {error_count}")
            
            if success_count > 0:
                print(f"\n🎯 Successful Calculations:")
                for ticker, result in results.items():
                    if result['status'] == 'success':
                        asset_type = result.get('asset_type', 'unknown')
                        print(f"   {ticker} ({asset_type}): ${result['reference_close']:.2f} (ATR: ${result['reference_atr']:.2f})")
            
            if error_count > 0:
                print(f"\n❌ Failed Calculations:")
                for ticker, result in results.items():
                    if result['status'] == 'error':
                        asset_type = result.get('asset_type', 'unknown')
                        print(f"   {ticker} ({asset_type}): {result['error']}")
            
            return 0 if success_count > 0 else 1
        
        if __name__ == "__main__":
            exit(main())
