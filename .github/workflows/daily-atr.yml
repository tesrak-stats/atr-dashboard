            final_data = {
                "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S %Z"),
                "last_updated_timestamp": datetime.now().timestamp(),
                "discovery_method": "smart_retry_with_levels",
                "execution_phase": phase,
                "levels_integration": "enabled",
                "intraday_support": "10min_bars_with_levels",
                "tickers": results
            }
            
            # Save results
            with open('atr_levels.json', 'w') as f:
                json.dump(final_data, f, indent=2)
            
            # Summary
            total_success = sum(1 for r in results.values() if r['status'] == 'success')
            total_failed = len(results) - total_success
            intraday_success = sum(1 for r in results.values() if r.get('intraday_status') == 'success')
            
            print(f"\n📊 Enhanced Processing Summary:")
            print(f"🎯 Phase: {phase}")
            print(f"📈 Processed this run: {len(targets)}")
            print(f"✅ Daily successful this run: {success_count}")
            print(f"✅ Total daily successful: {total_success}/{len(results)}")
            print(f"📈 Total intraday successful: {intraday_success}/{len(results)}")
            print(f"❌ Total remaining failures: {total_failed}")
            
            # Show data source breakdown
            polygon_count = sum(1 for r in results.values() if r.get('data_source', '').startswith('Polygon'))
            yahoo_count = len(results) - polygon_count
            if polygon_count > 0:
                print(f"🔵 Used Polygon: {polygon_count}")
            if yahoo_count > 0:
                print(f"🟡 Used Yahoo: {yahoo_count}")
            
            return 0
        
        if __name__ == "__main__":
            exit(main())
