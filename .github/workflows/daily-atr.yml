            # Load existing ATR data to merge results
            existing_atr = {}
            try:
                with open('atr_levels.json', 'r') as f:
                    existing_data = json.load(f)
                    existing_atr = existing_data.get('tickers', {})
            except:
                pass
            
            results = existing_atr.copy()  # Start with existing results
            success_count = 0
            
            # Process each target with enhanced levels support
            for ticker_key, ticker_config in targets.items():
                result = process_ticker_with_levels(ticker_key, ticker_config, target_date, phase)
                results[ticker_key] = result  # Update/overwrite with new result
                
                if result['status'] == 'success':
                    success_count += 1
            
