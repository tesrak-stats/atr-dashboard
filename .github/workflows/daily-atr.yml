# REPLACED: Daily Append to Historical Data (instead of full 6-month download)
    - name: Daily Append to Historical Data
      timeout-minutes: 8
      run: |
        echo "🔄 Starting daily append to historical datasets..."
        echo "⏰ Append start time: $(date)"
        
        cat > daily_append_handler.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import yfinance as yf
        import pandas as pd
        import gzip
        import os
        from datetime import datetime, timedelta, date
        import pytz
        
        def get_yesterday():
            """Get yesterday's date for data fetching"""
            # Use EST/EDT timezone for US markets
            eastern = pytz.timezone('US/Eastern')
            now_eastern = datetime.now(eastern)
            
            # If it's before 6 AM Eastern, use day before yesterday
            # (market data might not be available yet)
            if now_eastern.hour < 6:
                target_date = (now_eastern - timedelta(days=2)).date()
            else:
                target_date = (now_eastern - timedelta(days=1)).date()
            
            return target_date
        
        def load_historical_data(ticker_key):
            """Load existing compressed historical data"""
            compressed_file = f"historical_data/{ticker_key}_historical.csv.gz"
            
            if not os.path.exists(compressed_file):
                print(f"      ❌ No existing historical data for {ticker_key}")
                return None, compressed_file
            
            try:
                # Read compressed CSV
                with gzip.open(compressed_file, 'rt') as f:
                    historical_data = pd.read_csv(f)
                
                # Convert Date column to datetime for easier manipulation
                historical_data['Date'] = pd.to_datetime(historical_data['Date'])
                
                print(f"      📊 Loaded {len(historical_data)} historical records")
                print(f"         📅 Data range: {historical_data['Date'].min().date()} to {historical_data['Date'].max().date()}")
                
                return historical_data, compressed_file
                
            except Exception as e:
                print(f"      ❌ Error loading historical data: {str(e)}")
                return None, compressed_file
        
        def fetch_new_daily_data(ticker_key, yf_symbol, target_date, last_date_in_data):
            """Fetch new daily data since last update"""
            print(f"      🔍 Checking for new data since {last_date_in_data}...")
            
            try:
                # Calculate date range for fetching
                start_date = last_date_in_data + timedelta(days=1)
                
                # Don't fetch if we're already up to date
                if start_date > target_date:
                    print(f"      ✅ Historical data is current (last: {last_date_in_data}, target: {target_date})")
                    return None
                
                print(f"      🔄 Fetching data from {start_date} to {target_date}")
                
                # Fetch data for the date range
                yf_ticker = yf.Ticker(yf_symbol)
                new_data = yf_ticker.history(start=start_date, end=target_date + timedelta(days=1))
                
                if new_data.empty:
                    print(f"      ⚠️  No new data available for {yf_symbol}")
                    return None
                
                # Reset index to get Date as column
                new_data = new_data.reset_index()
                
                # Handle MultiIndex columns if present
                if isinstance(new_data.columns, pd.MultiIndex):
                    new_data.columns = new_data.columns.get_level_values(0)
                
                # Ensure standard column names and data consistency
                standard_columns = ['Date', 'Open', 'High', 'Low', 'Close', 'Volume']
                available_columns = [col for col in standard_columns if col in new_data.columns]
                new_data = new_data[available_columns]
                
                # Add metadata (consistent with existing data)
                new_data['Ticker'] = ticker_key
                new_data['YF_Symbol'] = yf_symbol
                new_data['Downloaded_At'] = datetime.now().isoformat()
                
                # Convert Date column to datetime for consistency
                new_data['Date'] = pd.to_datetime(new_data['Date'])
                
                print(f"      ✅ Fetched {len(new_data)} new records")
                print(f"         📅 New data range: {new_data['Date'].min().date()} to {new_data['Date'].max().date()}")
                
                return new_data
                
            except Exception as e:
                print(f"      ❌ Error fetching new data: {str(e)}")
                return None
        
        def detect_and_handle_gaps(historical_data, new_data, ticker_key, yf_symbol):
            """Detect missing dates and attempt backfill"""
            if len(historical_data) == 0:
                return new_data
            
            # Get expected trading days between last historical date and first new date
            last_historical = historical_data['Date'].max().date()
            
            if new_data is not None and len(new_data) > 0:
                first_new = new_data['Date'].min().date()
                
                # Simple gap detection (trading days between last and first new)
                expected_days = pd.bdate_range(start=last_historical + timedelta(days=1), 
                                             end=first_new - timedelta(days=1))
                
                if len(expected_days) > 0:
                    print(f"      🔍 Detected {len(expected_days)} potential missing trading days")
                    
                    # Attempt to backfill gaps
                    try:
                        gap_data = yf.Ticker(yf_symbol).history(
                            start=last_historical + timedelta(days=1),
                            end=first_new
                        )
                        
                        if not gap_data.empty:
                            # Process gap data same as new data
                            gap_data = gap_data.reset_index()
                            if isinstance(gap_data.columns, pd.MultiIndex):
                                gap_data.columns = gap_data.columns.get_level_values(0)
                            
                            standard_columns = ['Date', 'Open', 'High', 'Low', 'Close', 'Volume']
                            available_columns = [col for col in standard_columns if col in gap_data.columns]
                            gap_data = gap_data[available_columns]
                            
                            gap_data['Ticker'] = ticker_key
                            gap_data['YF_Symbol'] = yf_symbol
                            gap_data['Downloaded_At'] = datetime.now().isoformat()
                            gap_data['Date'] = pd.to_datetime(gap_data['Date'])
                            
                            print(f"      🔧 Backfilled {len(gap_data)} missing records")
                            
                            # Combine gap data with new data
                            if new_data is not None:
                                combined = pd.concat([gap_data, new_data], ignore_index=True)
                                return combined.sort_values('Date').drop_duplicates(subset=['Date'])
                            else:
                                return gap_data
                                
                    except Exception as e:
                        print(f"      ⚠️  Gap backfill failed: {str(e)}")
            
            return new_data
        
        def save_updated_data(historical_data, new_data, compressed_file):
            """Combine historical and new data, save compressed"""
            try:
                if new_data is None or len(new_data) == 0:
                    print(f"      ℹ️  No new data to append")
                    return True
                
                # Combine historical and new data
                combined_data = pd.concat([historical_data, new_data], ignore_index=True)
                
                # Sort by date and remove any duplicates
                combined_data = combined_data.sort_values('Date').drop_duplicates(subset=['Date'], keep='last')
                
                # Save compressed
                with gzip.open(compressed_file, 'wt') as f:
                    combined_data.to_csv(f, index=False)
                
                # Calculate file sizes for reporting
                compressed_size = os.path.getsize(compressed_file) / 1024  # KB
                
                print(f"      ✅ Updated dataset saved: {len(combined_data)} total records")
                print(f"         📦 Compressed size: {compressed_size:.1f} KB")
                print(f"         📊 Added {len(new_data)} new records")
                
                return True
                
            except Exception as e:
                print(f"      ❌ Error saving updated data: {str(e)}")
                return False
        
        def append_ticker_data(ticker_key, ticker_config, target_date):
            """Handle daily append for a single ticker"""
            print(f"   🔄 Processing {ticker_key}...")
            
            yf_symbol = ticker_config.get('yf_symbol', ticker_key)
            
            if yf_symbol != ticker_key:
                print(f"      🔄 Using mapped symbol: {ticker_key} -> {yf_symbol}")
            
            try:
                # Step 1: Load existing historical data
                historical_data, compressed_file = load_historical_data(ticker_key)
                
                if historical_data is None:
                    print(f"      ⚠️  No existing data - falling back to full 6-month download")
                    # Could implement fallback to full download here
                    return {'status': 'error', 'error': 'No existing historical data'}
                
                # Step 2: Determine what new data we need
                last_date_in_data = historical_data['Date'].max().date()
                
                # Step 3: Fetch new daily data
                new_data = fetch_new_daily_data(ticker_key, yf_symbol, target_date, last_date_in_data)
                
                # Step 4: Handle gaps (backfill missing trading days)
                new_data = detect_and_handle_gaps(historical_data, new_data, ticker_key, yf_symbol)
                
                # Step 5: Save updated dataset
                if save_updated_data(historical_data, new_data, compressed_file):
                    return {
                        'status': 'success', 
                        'records_added': len(new_data) if new_data is not None else 0,
                        'total_records': len(historical_data) + (len(new_data) if new_data is not None else 0)
                    }
                else:
                    return {'status': 'error', 'error': 'Failed to save updated data'}
                
            except Exception as e:
                print(f"      ❌ Error processing {ticker_key}: {str(e)}")
                return {'status': 'error', 'error': str(e)}
        
        def main():
            """Main daily append function"""
            print("🔄 Daily Historical Data Append")
            print("=" * 40)
            
            # Determine target date (yesterday's market data)
            target_date = get_yesterday()
            print(f"🎯 Target date: {target_date}")
            
            # Load discovered tickers
            try:
                with open('discovered_tickers.json', 'r') as f:
                    config = json.load(f)
                discovered_tickers = config.get('tickers', {})
            except Exception as e:
                print(f"❌ Could not load discovered tickers: {e}")
                return 1
            
            if not discovered_tickers:
                print("❌ No discovered tickers found")
                return 1
            
            print(f"📊 Processing daily append for {len(discovered_tickers)} tickers...")
            
            results = {}
            success_count = 0
            
            # Process each ticker
            for ticker_key, ticker_config in discovered_tickers.items():
                result = append_ticker_data(ticker_key, ticker_config, target_date)
                results[ticker_key] = result
                
                if result['status'] == 'success':
                    success_count += 1
                    records_added = result.get('records_added', 0)
                    if records_added > 0:
                        print(f"   ✅ {ticker_key}: Added {records_added} new records")
                    else:
                        print(f"   ✅ {ticker_key}: Already current")
                else:
                    print(f"   ❌ {ticker_key}: {result.get('error', 'Unknown error')}")
            
            # Summary
            print(f"\n📊 Daily Append Summary:")
            print(f"✅ Successful: {success_count}/{len(discovered_tickers)} tickers")
            print(f"❌ Errors: {len(discovered_tickers) - success_count}/{len(discovered_tickers)} tickers")
            
            total_records_added = sum(r.get('records_added', 0) for r in results.values() if r['status'] == 'success')
            print(f"📈 Total new records added: {total_records_added}")
            
            return 0 if success_count > 0 else 1
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python daily_append_handler.py
        
        echo "✅ Daily append to historical data completed"
        echo "⏰ Append end time: $(date)"
