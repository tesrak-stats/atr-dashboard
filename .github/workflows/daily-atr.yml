name: Daily ATR Calculator - Dynamic Discovery Mode

# Run at midnight Eastern Time on weekdays (actually early morning of trading day)
on:
  schedule:
    # 05:00 UTC = 12:00 AM ET (during standard time)
    # 04:00 UTC = 12:00 AM ET (during daylight time)  
    - cron: '0 5 * * 2-6'  # Tue-Sat at 5:00 AM UTC (EST) = Mon-Fri midnight ET
    - cron: '0 4 * * 2-6'  # Tue-Sat at 4:00 AM UTC (EDT) = Mon-Fri midnight ET
  
  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  calculate-atr:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Overall job timeout
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas pytz
    
    - name: Discover Tickers from Repository
      timeout-minutes: 8
      run: |
        echo "🔍 Starting ticker discovery from repository files..."
        echo "⏰ Discovery start time: $(date)"
        
        cat > discover_tickers.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import glob
        import re
        import yfinance as yf
        import time
        from datetime import datetime
        
        def extract_ticker_from_filename(filename):
            """Extract ticker from various filename patterns"""
            # Pattern: atr_summary_SPX_SESSION_*.csv
            match = re.match(r'atr_summary_([A-Z]+)_', filename)
            if match:
                return match.group(1)
                
            # Pattern: atr_level_totals_ES_ROLLING_*.csv
            match = re.match(r'atr_level_totals_([A-Z]+)_', filename)
            if match:
                return match.group(1)
                
            # Pattern: statecheck_detailed_SPX_*.csv  
            match = re.match(r'statecheck_detailed_([A-Z]+)_', filename)
            if match:
                return match.group(1)
                
            # Pattern: zonebaseline_detailed_ES_*.csv
            match = re.match(r'zonebaseline_detailed_([A-Z]+)_', filename)
            if match:
                return match.group(1)
                
            # Pattern: zonebaseline_hourly_ES_*.csv
            match = re.match(r'zonebaseline_hourly_([A-Z]+)_', filename)
            if match:
                return match.group(1)
                
            # Pattern: SPX_SESSION_*.csv
            match = re.match(r'^([A-Z]+)_(SESSION|ROLLING|STATECHECK)', filename)
            if match:
                return match.group(1)
                
            return None
        
        def discover_existing_tickers():
            """Discover all tickers from existing files"""
            print("🔍 Discovering existing tickers from file structure...")
            
            tickers = set()
            
            # Discover from ATR JSON
            try:
                with open("atr_levels.json", 'r') as f:
                    atr_data = json.load(f)
                    
                if "tickers" in atr_data:
                    for ticker_key in atr_data["tickers"]:
                        tickers.add(ticker_key)
                        
                print(f"   📊 Found {len(tickers)} tickers in ATR JSON")
            except Exception as e:
                print(f"   ⚠️ Could not read ATR JSON: {e}")
            
            # Discover from CSV files using glob patterns
            csv_patterns = [
                "atr_summary_*_*.csv",
                "atr_level_totals_*_*.csv",
                "statecheck_detailed_*.csv", 
                "zonebaseline_detailed_*.csv",
                "zonebaseline_hourly_*.csv",
                "*_SESSION_*.csv",
                "*_ROLLING_*.csv"
            ]
            
            for pattern in csv_patterns:
                files = glob.glob(pattern)
                for file_path in files:
                    ticker = extract_ticker_from_filename(file_path)
                    if ticker:
                        tickers.add(ticker)
            
            return sorted(list(tickers))
        
        def learn_ticker_characteristics(ticker):
            """Learn ticker characteristics from Yahoo Finance"""
            print(f"   🧠 Learning characteristics of {ticker}...")
            
            # TEMPORARY: Symbol mapping for trial period
            # TODO: Remove after Barchart data dump and enhanced summarizer
            TEMP_SYMBOL_MAP = {
                'SPX': '^GSPC',
                'ES': 'ES=F'
            }
            
            yf_symbol = TEMP_SYMBOL_MAP.get(ticker, ticker)
            if yf_symbol != ticker:
                print(f"      🔄 TEMP mapping: {ticker} -> {yf_symbol}")
            
            try:
                # Test data availability with small sample
                yf_ticker = yf.Ticker(yf_symbol)
                test_data = yf_ticker.history(period="5d")
                
                if not test_data.empty:
                    # Learn trading schedule from actual data timestamps
                    weekdays = [dt.weekday() for dt in test_data.index]
                    
                    if all(day < 5 for day in weekdays):
                        schedule = 'weekdays_only'
                    elif len(set(weekdays)) == 7:
                        schedule = 'continuous'  
                    else:
                        schedule = 'extended_hours'
                    
                    characteristics = {
                        'ticker': ticker,
                        'yf_symbol': yf_symbol,  # Use mapped symbol
                        'data_available': True,
                        'trading_schedule': schedule,
                        'discovered_at': datetime.now().isoformat(),
                        'temp_mapping': yf_symbol != ticker  # Flag for cleanup later
                    }
                    
                    print(f"      ✅ {ticker}: Available, schedule={schedule}")
                    return characteristics
                else:
                    print(f"      ❌ {ticker}: No data available")
                    return None
                    
            except Exception as e:
                print(f"      ⚠️ {ticker}: Error learning characteristics - {e}")
                return None
        
        def main():
            print("🚀 Dynamic Ticker Discovery")
            print("=" * 40)
            
            # Discover tickers
            discovered_tickers = discover_existing_tickers()
            
            if not discovered_tickers:
                print("❌ No tickers discovered - using fallback")
                return 1
            
            print(f"📁 Total discovered tickers: {len(discovered_tickers)}")
            
            # Learn characteristics  
            valid_tickers = {}
            for ticker in discovered_tickers:
                characteristics = learn_ticker_characteristics(ticker)
                if characteristics and characteristics.get('data_available', False):
                    valid_tickers[ticker] = characteristics
                
                # Brief pause to respect API limits
                time.sleep(0.5)
            
            # Create discovered config
            config = {
                'discovered_at': datetime.now().isoformat(),
                'method': 'github_repo_discovery',
                'tickers': valid_tickers
            }
            
            # Save discovered config
            with open('discovered_tickers.json', 'w') as f:
                json.dump(config, f, indent=2)
            
            print(f"✅ Discovery complete: {len(valid_tickers)} valid tickers")
            for ticker in valid_tickers:
                schedule = valid_tickers[ticker]['trading_schedule']
                print(f"   ✅ {ticker}: {schedule}")
            
            return 0
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python discover_tickers.py
        
        echo "✅ Ticker discovery completed"
        echo "⏰ Discovery end time: $(date)"
    
    - name: Save Historical Data to CSV
      timeout-minutes: 5
      run: |
        echo "💾 Saving 6-month historical data to permanent CSV files..."
        echo "⏰ CSV save start time: $(date)"
        
        cat > save_historical_data.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import yfinance as yf
        import pandas as pd
        import os
        from datetime import datetime, timedelta, date
        
        def save_ticker_historical_data(ticker_key, yf_symbol):
            """Save 6 months of historical data to CSV"""
            print(f"   📊 Saving {ticker_key} ({yf_symbol}) historical data...")
            
            try:
                # Get 6 months of data (same as ATR calculation)
                yf_ticker = yf.Ticker(yf_symbol)
                historical_data = yf_ticker.history(period="6mo")
                
                if historical_data.empty:
                    print(f"      ❌ No historical data available for {yf_symbol}")
                    return False
                
                # Reset index to get Date as column
                historical_data = historical_data.reset_index()
                
                # Handle MultiIndex columns if present
                if isinstance(historical_data.columns, pd.MultiIndex):
                    historical_data.columns = historical_data.columns.get_level_values(0)
                
                # Ensure standard column names
                standard_columns = ['Date', 'Open', 'High', 'Low', 'Close', 'Volume']
                available_columns = [col for col in standard_columns if col in historical_data.columns]
                historical_data = historical_data[available_columns]
                
                # Add metadata
                historical_data['Ticker'] = ticker_key
                historical_data['YF_Symbol'] = yf_symbol
                historical_data['Downloaded_At'] = datetime.now().isoformat()
                
                # Save to CSV
                filename = f"{ticker_key}_historical_6months.csv"
                historical_data.to_csv(filename, index=False)
                
                print(f"      ✅ Saved {len(historical_data)} records to {filename}")
                print(f"         📅 Date range: {historical_data['Date'].min()} to {historical_data['Date'].max()}")
                
                return True
                
            except Exception as e:
                print(f"      ❌ Error saving {ticker_key}: {str(e)}")
                return False
        
        def main():
            print("💾 Historical Data CSV Saver")
            print("=" * 40)
            
            # Load discovered tickers
            try:
                with open('discovered_tickers.json', 'r') as f:
                    config = json.load(f)
                discovered_tickers = config.get('tickers', {})
            except Exception as e:
                print(f"❌ Could not load discovered tickers: {e}")
                return 1
            
            if not discovered_tickers:
                print("❌ No discovered tickers found")
                return 1
            
            print(f"📊 Saving historical data for {len(discovered_tickers)} tickers...")
            
            success_count = 0
            for ticker_key, ticker_config in discovered_tickers.items():
                yf_symbol = ticker_config.get('yf_symbol', ticker_key)
                
                if save_ticker_historical_data(ticker_key, yf_symbol):
                    success_count += 1
            
            print(f"✅ Successfully saved {success_count}/{len(discovered_tickers)} historical datasets")
            
            if success_count > 0:
                print(f"📁 Files created:")
                for ticker_key in discovered_tickers.keys():
                    filename = f"{ticker_key}_historical_6months.csv"
                    if os.path.exists(filename):
                        size_kb = os.path.getsize(filename) / 1024
                        print(f"   📄 {filename} ({size_kb:.1f} KB)")
            
            return 0 if success_count > 0 else 1
        
        if __name__ == "__main__":
            exit(main())
        EOF
        
        python save_historical_data.py
        
        echo "✅ Historical data CSV save completed"
        echo "⏰ CSV save end time: $(date)"
    - name: Run Dynamic ATR Calculator
      timeout-minutes: 10
      run: |
        echo "🔄 Starting dynamic multi-ticker ATR calculation..."
        echo "⏰ Current time: $(date)"
        
        cat > dynamic_atr_updater.py << 'EOF'
        #!/usr/bin/env python3
        import json
        import sys
        from daily_atr_updater import calculate_atr_levels
        from datetime import datetime
        
        def load_discovered_tickers():
            """Load discovered ticker configuration"""
            try:
                with open('discovered_tickers.json', 'r') as f:
                    config = json.load(f)
                return config.get('tickers', {})
            except Exception as e:
                print(f"❌ Could not load discovered tickers: {e}")
                return None
        
        def main():
            print("🎯 Dynamic ATR Calculator")
            print("=" * 30)
            
            # Load discovered tickers
            discovered_tickers = load_discovered_tickers()
            
            if not discovered_tickers:
                print("❌ No discovered tickers - calculation failed")
                return 1
            
            print(f"📊 Processing {len(discovered_tickers)} discovered tickers...")
            
            # Process each discovered ticker
            results = {}
            for ticker_key, config in discovered_tickers.items():
                print(f"🔄 Processing {ticker_key}...")
                
                yf_symbol = config.get('yf_symbol', ticker_key)
                if yf_symbol != ticker_key:
                    print(f"   🔄 Using mapped symbol: {ticker_key} -> {yf_symbol}")
                
                ticker_data = calculate_atr_levels(ticker=yf_symbol)
                
                # Add metadata
                ticker_data['ticker_key'] = ticker_key
                ticker_data['display_name'] = f"{ticker_key} (Discovered)"
                
                results[ticker_key] = ticker_data
                
                if ticker_data['status'] == 'success':
                    print(f"✅ {ticker_key}: Close=${ticker_data['reference_close']:.2f}, ATR=${ticker_data['reference_atr']:.2f}")
                else:
                    print(f"❌ {ticker_key}: ERROR - {ticker_data['error']}")
            
            # Create final data structure
            final_data = {
                "last_updated": datetime.now().strftime("%Y-%m-%d %H:%M:%S %Z"),
                "last_updated_timestamp": datetime.now().timestamp(),
                "discovery_method": "github_repo_scan",
                "tickers": results
            }
            
            # Save results
            with open('atr_levels.json', 'w') as f:
                json.dump(final_data, f, indent=2)
            
            # Summary
            success_count = sum(1 for data in results.values() if data['status'] == 'success')
            error_count = len(results) - success_count
            
            print(f"📊 SUMMARY:")
            print(f"✅ Successful: {success_count}/{len(results)} tickers")
            print(f"❌ Errors: {error_count}/{len(results)} tickers")
            
            if success_count > 0:
                print(f"🎯 Successful Calculations:")
                for ticker_key, data in results.items():
                    if data['status'] == 'success':
                        print(f"   {ticker_key}: ${data['reference_close']:.2f} (ATR: ${data['reference_atr']:.2f})")
            
            return 0 if success_count > 0 else 1
        
        if __name__ == "__main__":
            sys.exit(main())
        EOF
        
        python dynamic_atr_updater.py
        
        echo "✅ Dynamic ATR calculation completed"
        echo "⏰ Completion time: $(date)"
    
    - name: Check Results
      timeout-minutes: 2
      run: |
        if [ -f "atr_levels.json" ]; then
          echo "✅ ATR levels JSON file created successfully"
          echo "📊 File size: $(du -h atr_levels.json | cut -f1)"
          echo "📋 Discovery results:"
          
          # Show discovered vs processed tickers
          if [ -f "discovered_tickers.json" ]; then
            echo "🔍 Discovered tickers:"
            python -c "import json; data=json.load(open('discovered_tickers.json')); print('\n'.join([f'   • {k}: {v[\"trading_schedule\"]}' for k,v in data.get('tickers', {}).items()]))"
          fi
          
          echo ""
          echo "📊 Final ATR results:"
          python -c "import json; data=json.load(open('atr_levels.json')); print(f'🎯 {len(data.get(\"tickers\", {}))} tickers processed')"
          
        else
          echo "❌ ATR levels JSON file not found!"
          exit 1
        fi
    
    - name: Commit Updated Files
      timeout-minutes: 3
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add discovered config, ATR results, and compressed historical CSVs
        git add atr_levels.json
        if [ -f "discovered_tickers.json" ]; then
          git add discovered_tickers.json
        fi
        
        # Add the historical_data directory and compressed CSV files
        git add historical_data/*.gz 2>/dev/null || true
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          echo "📝 Committing changes..."
          git commit -m "🤖 Dynamic discovery ATR update - $(date '+%Y-%m-%d %H:%M UTC')"
          echo "📤 Pushing to repository..."
          git push origin ${{ github.ref_name }}
          echo "✅ Successfully pushed changes"
        fi
    
    # Optional: Send notification on failure
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Dynamic discovery ATR calculation failed!"
        echo "Check the logs above for details."
